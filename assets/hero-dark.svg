<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-label="XNet">
<rect x="0.5" y="0.5" width="859" height="239" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="36" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="750" fill="#f0efec" text-anchor="start">XNet</text><text x="38" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c3c2b7" text-anchor="start">Fast, safe networking for Garry's Mod. Send any Lua value, any size.</text><rect x="36" y="114" width="44" height="4" rx="2" fill="#3987e5"/><text x="36" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="750" fill="#f0efec" text-anchor="start">0.91 µs</text><text x="36" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">server CPU to send a small message,</text><text x="36" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">the same as hand-written net code</text><text x="298.6666666666667" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="750" fill="#f0efec" text-anchor="start">3.4×</text><text x="298.6666666666667" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">smaller than net.WriteTable</text><text x="298.6666666666667" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">on inventory records</text><text x="561.3333333333334" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="750" fill="#f0efec" text-anchor="start">0 ms</text><text x="561.3333333333334" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">added latency, with batching on</text><text x="561.3333333333334" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">and flood protection built in</text>
</svg>